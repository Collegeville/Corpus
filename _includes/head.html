<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- jekyll-seo-tag generates <title>, canonical URL, Open Graph and Twitter
     Card tags, and JSON-LD structured data. Content pages set `summary`
     rather than `description` in front matter, so we pass that through
     explicitly and suppress the tag's own (site-description-only)
     meta description in favor of the one below. -->
{% seo title=false description=false %}
<meta name="description" content="{{ page.summary | default: site.description | strip_html | truncate: 160 }}">
<meta property="og:description" content="{{ page.summary | default: site.description | strip_html | truncate: 160 }}">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
